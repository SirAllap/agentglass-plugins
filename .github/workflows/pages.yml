# Publishes plugins.json and the market site on this repository's Pages site.
# plugins.json stays at the root, which is where the app's market and the
# project's plugins page read it from; the site in site/ sits next to it and
# reads the same file. Pages answers with `Access-Control-Allow-Origin: *`, so
# the landing page on the app's own site can fetch it across origins.
#
# A bad merge here changes a list and a static page. It ships no binary and
# moves no tag: that is the reason the catalogue lives in its own repository.
name: Publish the catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The site draws the catalogue as text
        run: node --test site/test/*.test.mjs
      - name: Assemble the site, with plugins.json at its root
        run: scripts/build-site.sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
